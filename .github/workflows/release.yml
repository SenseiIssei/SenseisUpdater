name: release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-cli:
    name: build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: odysync.exe
            archive: odysync-windows-x86_64.zip
          - os: ubuntu-latest
            artifact: odysync
            archive: odysync-linux-x86_64.tar.gz
          # `macos-latest` is Apple Silicon; naming this x86_64 would ship an
          # arm64 binary to Intel users. Intel Macs are not built at all — add
          # a `macos-13` entry if that is wanted.
          - os: macos-latest
            artifact: odysync
            archive: odysync-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release -p odysync-cli

      # Signing is a no-op until the Trusted Signing secrets exist, so the
      # workflow keeps working today and starts signing the moment they are
      # added — rather than being a separate change that has to be remembered
      # at the same time as the procurement finishing. See docs/SIGNING.md.
      #
      # Signing happens before the archive is built, so the zip contains the
      # signed binary rather than an unsigned one next to a signature.
      - name: Sign the CLI (Windows)
        if: matrix.os == 'windows-latest' && vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: 7z a ${{ matrix.archive }} target/release/${{ matrix.artifact }}

      - name: Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: tar czf ${{ matrix.archive }} -C target/release ${{ matrix.artifact }}

      - name: Generate SHA-256
        shell: bash
        run: |
          # One format on every platform: "<hash>  <filename>", the shape
          # `sha256sum -c` expects. certutil printed a bare hash with a
          # trailing CR, so the Windows checksum file could not be verified
          # the same way as the others.
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            hash=$(certutil -hashfile "${{ matrix.archive }}" SHA256 | sed -n 2p | tr -d ' \r\n')
            echo "$hash  ${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  build-gui-windows:
    name: build GUI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: apps/gui
        run: npm ci

      - name: Build Tauri app
        working-directory: apps/gui
        run: npx tauri build

      # The installer is the artifact SmartScreen actually judges — a user
      # double-clicks this, not the CLI — so it matters more than the binaries.
      - name: Sign the installer
        if: vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Published alongside the installer so a user can verify the download
      # without trusting the page it came from.
      - name: Generate SHA-256 for the installer
        shell: bash
        run: |
          cd target/release/bundle/nsis
          for f in *.exe; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      # `src-tauri` is a workspace member, so cargo puts its output in the
      # workspace-root `target/`, not `apps/gui/src-tauri/target/`. Combined
      # with `if-no-files-found: warn` that meant the installer was quietly
      # never uploaded — every release shipped CLI binaries only.
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: odysync-gui-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error

  publish:
    needs: [build-cli, build-gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: odysync-windows-x86_64.zip
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: odysync-linux-x86_64.tar.gz
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: odysync-macos-arm64.tar.gz
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: odysync-gui-windows
          path: artifacts

      # A tool whose entire purpose is keeping other software current should be
      # installable with `winget install Odysync`. The manifests are generated
      # here because the installer's SHA-256 is only known now; submitting them
      # to microsoft/winget-pkgs stays a manual step.
      - name: Generate winget manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          installer=$(ls artifacts/*.exe | head -n1)
          sha=$(sha256sum "$installer" | cut -d' ' -f1 | tr 'a-f' 'A-F')
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$installer")"
          out="winget/SenseiIssei.Odysync/${version}"
          mkdir -p "$out"

          cat > "$out/SenseiIssei.Odysync.yaml" <<EOF
          PackageIdentifier: SenseiIssei.Odysync
          PackageVersion: ${version}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF

          cat > "$out/SenseiIssei.Odysync.installer.yaml" <<EOF
          PackageIdentifier: SenseiIssei.Odysync
          PackageVersion: ${version}
          InstallerType: nullsoft
          Scope: machine
          InstallModes:
            - interactive
            - silent
          Installers:
            - Architecture: x64
              InstallerUrl: ${url}
              InstallerSha256: ${sha}
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          cat > "$out/SenseiIssei.Odysync.locale.en-US.yaml" <<EOF
          PackageIdentifier: SenseiIssei.Odysync
          PackageVersion: ${version}
          PackageLocale: en-US
          Publisher: SenseiIssei
          PublisherUrl: https://github.com/SenseiIssei
          PackageName: Odysync
          PackageUrl: https://github.com/${GITHUB_REPOSITORY}
          License: MIT
          LicenseUrl: https://github.com/${GITHUB_REPOSITORY}/blob/main/LICENSE
          ShortDescription: Safe, fast software and driver updates for Windows, macOS and Linux.
          Tags:
            - updater
            - drivers
            - windows-update
            - maintenance
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

          echo "Generated manifests for ${version}:"
          find winget -type f

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: winget/**
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          artifacts: "artifacts/*"